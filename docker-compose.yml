services:
  # Redis used by the gem's own RSpec suite (spec/) — matches port 6780
  # expected by spec/spec_helper.rb.
  redis-test:
    image: redis:7-alpine
    container_name: ruby_reactor_redis_test
    ports:
      - "6780:6379"
    command: redis-server --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Databases for the gem's RSpec suite under the ActiveRecord storage adapter
  # (RUBY_REACTOR_TEST_STORAGE=active_record). No container_name, so several
  # worktrees can each run their own compose project without colliding.
  test-postgres:
    image: postgres:16-alpine
    ports:
      - "6781:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ruby_reactor_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  test-mysql:
    image: mysql:8.4
    ports:
      - "6782:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ruby_reactor_test
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Dedicated Redis for the demo Rails app (storage + Sidekiq).
  demo-redis:
    image: redis:7-alpine
    container_name: ruby_reactor_demo_redis
    ports:
      - "6380:6379"
    volumes:
      - demo_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Databases for running demo_app on the ActiveRecord storage adapter:
  #   RUBY_REACTOR_STORAGE=active_record DATABASE_URL=postgres://postgres:postgres@demo-postgres:5432/demo_app
  #   RUBY_REACTOR_STORAGE=active_record DATABASE_URL=trilogy://root:root@demo-mysql:3306/demo_app
  demo-postgres:
    image: postgres:16-alpine
    ports:
      - "6783:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: demo_app
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  demo-mysql:
    image: mysql:8.4
    ports:
      - "6784:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: demo_app
    volumes:
      - demo_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  # demo_app development container — builds with the local gem source bind-mounted
  # so edits to `lib/` are picked up immediately.
  demo-app:
    build:
      context: .
      dockerfile: demo_app/Dockerfile.dev
    container_name: ruby_reactor_demo_app
    depends_on:
      demo-redis:
        condition: service_healthy
      demo-sidekiq:
        condition: service_healthy
    environment:
      RAILS_ENV: development
      REDIS_URL: redis://demo-redis:6379/1
      # Storage/queue selection (specs/011). A Redis-free acceptance run:
      #   docker compose stop redis-test demo-redis
      #   docker compose run --rm --no-deps -e RUBY_REACTOR_STORAGE=active_record \
      #     -e RUBY_REACTOR_QUEUE=active_job demo-app bash -c "bin/rails db:prepare && bin/rails demo:all"
      RUBY_REACTOR_STORAGE: ${RUBY_REACTOR_STORAGE:-redis}
      RUBY_REACTOR_QUEUE: ${RUBY_REACTOR_QUEUE:-sidekiq}
      DATABASE_URL: # passed through only when set in your shell
      BUNDLE_PATH: /bundle
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://teley:3000/r/ruby_reactor_session
      OTEL_EXPORTER_OTLP_PROTOCOL: http/json
    ports:
      - "3789:3000"
    volumes:
      - .:/workspace
      - bundle_cache:/bundle
    working_dir: /workspace/demo_app
    command: bash -c "bin/rails db:prepare && bin/rails server -b 0.0.0.0"

  # Optional Sidekiq worker against the same demo redis.
  demo-sidekiq:
    build:
      context: .
      dockerfile: demo_app/Dockerfile.dev
    container_name: ruby_reactor_demo_sidekiq
    depends_on:
      demo-redis:
        condition: service_healthy
    environment:
      RAILS_ENV: development
      REDIS_URL: redis://demo-redis:6379/1
      # Storage/queue selection (specs/011). A Redis-free acceptance run:
      #   docker compose stop redis-test demo-redis
      #   docker compose run --rm --no-deps -e RUBY_REACTOR_STORAGE=active_record \
      #     -e RUBY_REACTOR_QUEUE=active_job demo-app bash -c "bin/rails db:prepare && bin/rails demo:all"
      RUBY_REACTOR_STORAGE: ${RUBY_REACTOR_STORAGE:-redis}
      RUBY_REACTOR_QUEUE: ${RUBY_REACTOR_QUEUE:-sidekiq}
      DATABASE_URL: # passed through only when set in your shell
      BUNDLE_PATH: /bundle
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://teley:3000/r/ruby_reactor_session
      OTEL_EXPORTER_OTLP_PROTOCOL: http/json
    volumes:
      - .:/workspace
      - bundle_cache:/bundle
    working_dir: /workspace/demo_app
    command: bundle exec sidekiq
    healthcheck:
      test: ["CMD-SHELL", "grep -q sidekiq /proc/1/cmdline"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Teley trace viewer service
  teley:
    build:
      context: ./teley
    container_name: ruby_reactor_teley
    ports:
      - "5754:3000"
    volumes:
      - teley_data:/app/.data

volumes:
  demo_redis_data:
  demo_postgres_data:
  demo_mysql_data:
  bundle_cache:
  teley_data:
