on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or SHA to publish from
        required: true
        type: string
      version:
        description: Gem version to publish
        required: true
        type: string
name: Push Gem
jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.release.tag_name }}
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true
        ruby-version: '3.4.8'
    - name: Check whether version is already published
      id: publish_guard
      env:
        VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.release.tag_name }}
      run: |
        VERSION="${VERSION#v}"
        if gem list '^ruby_reactor$' -ra --source "https://rubygems.org" | grep -Eq "\(${VERSION}(,|\))"; then
          echo "publish_needed=false" >> "$GITHUB_OUTPUT"
          echo "Version ${VERSION} already exists on rubygems.org. Skipping publish."
        else
          echo "publish_needed=true" >> "$GITHUB_OUTPUT"
          echo "Version ${VERSION} is not published yet. Proceeding."
        fi
    - name: Release gem to RubyGems via trusted publishing
      if: steps.publish_guard.outputs.publish_needed == 'true'
      uses: rubygems/release-gem@v1
