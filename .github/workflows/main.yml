name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '3.4.8'

    services:
      redis:
        image: redis/redis-stack-server:latest
        ports:
          - 6780:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Run tests
      run: bundle exec rspec
    - name: Run rubocop
      run: bundle exec rubocop
      continue-on-error: true

  demo_app:
    runs-on: ubuntu-latest
    name: demo_app Rails Tests
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      REDIS_URL: redis://localhost:6379/1
    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4.8'
        bundler-cache: true
        working-directory: demo_app
    - name: Prepare database
      working-directory: demo_app
      run: bin/rails db:test:prepare
    - name: Run Rails specs
      working-directory: demo_app
      run: bundle exec rspec

  frontend:
    runs-on: ubuntu-latest
    name: Frontend Tests
    defaults:
      run:
        working-directory: gui
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: gui/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Run tests
      run: npm test
