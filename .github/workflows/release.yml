name: Release

on:
  workflow_run:
    workflows:
      - Ruby
    branches:
      - main
    types:
      - completed

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  release-please:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      prs_created: ${{ steps.release.outputs.prs_created }}
      release_created: ${{ steps.release.outputs.release_created }}
      release_sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  refresh-release-pr-lockfiles:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out release PR branch
        uses: actions/checkout@v4
        with:
          ref: release-please--branches--main--components--ruby_reactor

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.8'
          bundler-cache: true

      - name: Refresh root lockfile
        run: bundle lock

      - name: Refresh demo app lockfile
        working-directory: demo_app
        run: bundle lock

      - name: Commit updated lockfiles
        run: |
          if git diff --quiet -- Gemfile.lock demo_app/Gemfile.lock; then
            echo "No lockfile changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemfile.lock demo_app/Gemfile.lock
          git commit -m "chore: refresh release lockfiles"
          git push origin HEAD:release-please--branches--main--components--ruby_reactor

  publish-gem:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.release_sha }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.8'
          bundler-cache: true

      - name: Check whether version is already published
        id: publish_guard
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          if gem list '^ruby_reactor$' -ra --source "https://rubygems.org" | grep -Eq "\(${VERSION}(,|\))"; then
            echo "publish_needed=false" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} already exists on rubygems.org. Skipping publish."
          else
            echo "publish_needed=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is not published yet. Proceeding."
          fi

      - name: Release gem to RubyGems via trusted publishing
        if: steps.publish_guard.outputs.publish_needed == 'true'
        uses: rubygems/release-gem@v1
