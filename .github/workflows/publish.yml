name: Publish

on:
  workflow_run:
    workflows:
      - Release
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  guard:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check_release.outputs.should_publish }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check if a GitHub Release exists for the current gemspec version
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          GEM_NAME=$(ruby -e "spec = Gem::Specification.load('ruby_reactor.gemspec'); puts spec.name")
          VERSION=$(ruby -e "spec = Gem::Specification.load('ruby_reactor.gemspec'); puts spec.version.to_s")
          TAG_CANDIDATES=("${GEM_NAME}/v${VERSION}" "v${VERSION}")
          RELEASE_FOUND=false

          for TAG in "${TAG_CANDIDATES[@]}"; do
            echo "Checking GitHub Releases API for tag: ${TAG}"
            if gh api "/repos/${{ github.repository }}/releases/tags/${TAG}" --silent 2>/dev/null; then
              echo "Release ${TAG} found."
              RELEASE_FOUND=true
              break
            fi
          done

          if [ "${RELEASE_FOUND}" != "true" ]; then
            echo "No release found for any expected tag for version ${VERSION}. Skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_NUMBER=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/commits/${HEAD_SHA}/pulls" \
            --jq '.[] | select(.merged_at != null and .base.ref == "main" and any(.labels[]?; .name == "autorelease: tagged")) | .number' \
            2>/dev/null | head -n 1)

          if [ -n "${PR_NUMBER}" ]; then
            echo "Found merged PR #${PR_NUMBER} into main with label autorelease: tagged. Proceeding with publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "No merged PR into main with label autorelease: tagged is associated with ${HEAD_SHA}. Skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish-gem:
    needs: [guard]
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && needs.guard.outputs.should_publish == 'true'))
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.8'
          bundler-cache: true

      - name: Resolve gem version from gemspec
        id: gem_version
        run: |
          VERSION=$(ruby -e "spec = Gem::Specification.load('ruby_reactor.gemspec'); puts spec.version.to_s")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check whether version is already published
        id: publish_guard
        env:
          VERSION: ${{ steps.gem_version.outputs.version }}
        run: |
          if gem list '^ruby_reactor$' -ra --source "https://rubygems.org" | grep -Eq "\(${VERSION}(,|\))"; then
            echo "publish_needed=false" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} already exists on rubygems.org. Skipping publish."
          else
            echo "publish_needed=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is not published yet. Proceeding."
          fi

      - name: Release gem to RubyGems via trusted publishing
        if: steps.publish_guard.outputs.publish_needed == 'true'
        uses: rubygems/release-gem@v1
